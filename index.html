<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Equiv's Garage</title>
  
    <!-- 1. Google Fonts에서 Zen Maru Gothic 불러오기 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- 2. CSS로 폰트 및 간단한 디자인 설정 -->
    <style>
        body {
            /* 폰트 지정 (뒤에 sans-serif는 시스템 기본 폰트의 대체재입니다) */
            font-family: 'Zen Maru Gothic', sans-serif;
            
            /* 보기 좋게 배경색과 여백 주기 */
            background-color: #fcfbf9;
            color: #333333;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            line-height: 1.6;
        }
        
        h1 {
            color: #d35400;
        }
    </style>
</head>
</head>
<body>
    <h1>≡のガレージにようこそ！</h1>
    <p>授業とか自習とかのノートの保管所としてとか、色々使ってます。</p>
</body>
</html>
