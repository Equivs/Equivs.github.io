    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Designs: Fonts, Backgrouds, Navigations etc. -->
    <style>
        body {
            /* 폰트 지정 (뒤에 sans-serif는 시스템 기본 폰트의 대체재입니다) */
            font-family: 'Zen Maru Gothic', sans-serif;
            
            /* 보기 좋게 배경색과 여백 주기 */
            background-color: #fcfbf9;
            color: #333333;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            line-height: 1.6;
        }
        
        /* Navigation (1): Table */
        nav {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid #e0deda;
            padding-bottom: 15px;
        }

        /* Navgation (2): Buttons */
        nav a {
            text-decoration: none;
            color: #555555;
            font-weight: 700;
            margin: 0 10px;
            padding: 8px 16px;
            border-radius: 20px;
            transition: background-color 0.3s, color 0.3s;
            display: inline-block;
        }

        /* Navigation (3): Hovering */
        nav a:hover {
            background-color: #82bab3;
            color: white;
        }

        /* Navigation (4): Divisor */
        .divider {
            color: #d0ccc6;          /* 선의 색상 */
            font-weight: 400;        /* 선의 두께 느낌 조절 */
            margin: 0 15px;
            user-select: none;       /* 마우스 드래그로 선택되지 않게 방지 */
        }

        /* Navigation (5): SNS Favicons */
        .sns-icon {
            height: 20px;            /* 아이콘 크기 조절 */
            vertical-align: middle;  /* 텍스트와 높낮이 맞추기 */
            margin-left: 10px;       /* 왼쪽 여백 */
            transition: opacity 0.3s;
        }
        
        .sns-icon:hover {
            opacity: 0.7;            /* 마우스 올렸을 때 투명도 효과 */
        }

        /* Centering h1 */
        h1 {
            text-align: center;
            color: #82bab3;
            margin-top: 20px;
        }

        p {
            text-align: left;
        }

        .text-center {
            text-align: center;
        }
    </style>
</head>
