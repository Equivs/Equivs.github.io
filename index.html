<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Equiv's Garage</title>

    <link rel="icon" href="Files/Images/eq_favicon.png" type="image/png">
  
    <!-- Importing Fonts: Zen Maru Gothic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Designs: Fonts, Backgrouds, Navigations etc. -->
    <style>
        body {
            /* 폰트 지정 (뒤에 sans-serif는 시스템 기본 폰트의 대체재입니다) */
            font-family: 'Zen Maru Gothic', sans-serif;
            
            /* 보기 좋게 배경색과 여백 주기 */
            background-color: #fcfbf9;
            color: #333333;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            line-height: 1.6;
        }
        
        /* Navigation (1): Table */
        nav {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid #e0deda;
            padding-bottom: 15px;
        }

        /* Navgation (2): Buttons */
        nav a {
            text-decoration: none;
            color: #555555;
            font-weight: 700;
            margin: 0 10px;
            padding: 8px 16px;
            border-radius: 20px;
            transition: background-color 0.3s, color 0.3s;
            display: inline-block;
        }

        /* Navigation (3): Hovering */
        nav a:hover {
            background-color: #82bab3;
            color: white;
        }

        /* Navigation (4): Divisor */
        .divider {
            color: #d0ccc6;          /* 선의 색상 */
            font-weight: 400;        /* 선의 두께 느낌 조절 */
            margin: 0 15px;
            user-select: none;       /* 마우스 드래그로 선택되지 않게 방지 */
        }

        /* Navigation (5): SNS Favicons */
        .sns-link {
            padding: 0 !important;
            background: none !important;
        }

        .sns-icon {
            height: 20px;
            vertical-align: middle;
            margin-left: 10px;
            transition: opacity 0.3s;
        }

        .sns-icon:hover {
            opacity: 0.6;
            background: none;
        }

        /* Centering h1 */
        h1 {
            text-align: center;
            color: #82bab3;
            margin-top: 20px;
        }

        p {
            text-align: left;
        }

        .text-center {
            text-align: center;
        }
    </style>
</head>
</head>
<body>

    <h1>≡'s Garage</h1>
    <p class="text-center">授業とか自習とかのノートの保管所としてとか、色々使ってます。</p>
    
    <div id="nav-placeholder"></div>

    <p>ここはメインページです。色々使いたい用途が確定してそれぞれのページが作られたらここもある程度凝らしていくつもりですよ。</p>

<script>
        // 1. 현재 페이지의 경로를 분석하여 최상위 루트까지 가기 위해 필요한 '../' 개수 계산
        // (예: /Notes/24/metsp/metsp.html 이라면 상위로 3번 나가야 함)
        const pathSegments = window.location.pathname.split('/').filter(segment => 
            segment && !segment.endsWith('.html') && segment !== 'index.html'
        );
        
        // 로컬 환경과 깃허브 페이지 환경을 모두 고려한 상대 경로 접두사 생성
        // (깃허브 페이지에서 첫 번째 세그먼트가 저장소 이름인 경우 예외 처리)
        let depth = window.location.pathname.split('/').length - 2;
        if (window.location.hostname.includes('github.io')) {
            depth -= 1; // 깃허브 페이지의 저장소 이름 폴더 만큼 보정
        }
        if (depth < 0) depth = 0;

        let prefix = '';
        for (let i = 0; i < depth; i++) {
            prefix += '../';
        }

        // 2. nav.html 가져오기 (계산된 prefix 적용)
        const navFetchPath = prefix + 'nav.html';

        fetch(navFetchPath)
            .then(response => {
                if (!response.ok) throw new Error('nav.html을 찾을 수 없습니다.');
                return response.text();
            })
            .then(data => {
                document.getElementById('nav-placeholder').innerHTML = data;

                // 3. nav 내부의 <a> 태그 링크 경로 자동 변환
                const links = document.querySelectorAll('#nav-placeholder [data-link]');
                links.forEach(link => {
                    const target = link.getAttribute('data-link');
                    link.href = prefix + target;
                });

                // 4. nav 내부의 <img> 태그 이미지 경로 자동 변환
                const images = document.querySelectorAll('#nav-placeholder [data-src]');
                images.forEach(img => {
                    const target = img.getAttribute('data-src');
                    img.src = prefix + target;
                });
            })
            .catch(err => console.error('Nav load error:', err));
    </script>
</body>
</html>
