<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Equiv's Garage</title>

    <link rel="icon" href="Files/Images/eq_favicon.png" type="image/png">
  
    <!-- 1. Google Fonts에서 Zen Maru Gothic 불러오기 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- 2. CSS로 폰트 및 간단한 디자인 설정 -->
    <style>
        body {
            /* 폰트 지정 (뒤에 sans-serif는 시스템 기본 폰트의 대체재입니다) */
            font-family: 'Zen Maru Gothic', sans-serif;
            
            /* 보기 좋게 배경색과 여백 주기 */
            background-color: #fcfbf9;
            color: #333333;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            line-height: 1.6;
        }
        
/* 상단 내비게이션 탭 스타일 */
        nav {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid #e0deda;
            padding-bottom: 15px;
        }

        nav a {
            text-decoration: none;
            color: #555555;
            font-weight: 700;
            margin: 0 10px;
            padding: 8px 16px;
            border-radius: 20px;
            transition: background-color 0.3s, color 0.3s;
            display: inline-block;
        }

        /* 마우스를 올렸을 때 (이제 둥글기나 선에 방해받지 않고 깔끔하게 작동합니다) */
        nav a:hover {
            background-color: #82bab3;
            color: white;
        }

        /* 💡 독립적인 구분선 스타일 */
        .divider {
            color: #d0ccc6;          /* 선의 색상 */
            font-weight: 400;        /* 선의 두께 느낌 조절 */
            margin: 0 15px;
            user-select: none;       /* 마우스 드래그로 선택되지 않게 방지 */
        }

        /* h1, p 요소를 가운데 정렬 */
        h1 {
            text-align: center;
            color: #82bab3;
            margin-top: 20px;
        }

        p {
            text-align: left;
        }

        .text-center {
            text-align: center;
        }
    </style>
</head>
</head>
<body>

    <h1>≡'s Garage</h1>
    <p class="text-center">授業とか自習とかのノートの保管所としてとか、色々使ってます。</p>
    
    <nav>
        <a href="index.html">Home</a>
        <span class="divider"> | </span>
        <a href="tab1.html">Tab 1</a>
        <span class="divider"> | </span>
        <a href="tab2.html">Tab 2</a>
        <span class="divider"> | </span>
        <a href="tab3.html">Tab 3</a>
    </nav>

    <p>ここはメインページです。色々使いたい用途が確定してそれぞれのページが作られたらここもある程度凝らしていくつもりですよ。。</p>
    
</body>
</html>
