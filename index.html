<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Equiv's Garage</title>
  
    <!-- 1. Google Fonts에서 Zen Maru Gothic 불러오기 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- 2. CSS로 폰트 및 간단한 디자인 설정 -->
    <style>
        body {
            /* 폰트 지정 (뒤에 sans-serif는 시스템 기본 폰트의 대체재입니다) */
            font-family: 'Zen Maru Gothic', sans-serif;
            
            /* 보기 좋게 배경색과 여백 주기 */
            background-color: #fcfbf9;
            color: #333333;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            line-height: 1.6;
        }
        
/* 상단 내비게이션 탭 스타일 */
        nav {
            text-align: center; /* 탭 전체를 가운데로 */
            margin-bottom: 40px;
            border-bottom: 2px solid #e0deda;
            padding-bottom: 15px;
        }

        nav a {
            text-decoration: none;
            color: #555555;
            font-weight: 700;
            margin: 0 5px;
            padding: 8px 16px;
            border-radius: 12px;
            transition: background-color 0.3s, color 0.3s;
            
            /* 💡 구분선 추가 설정 */
            display: inline-block;
        }

        /* 첫 번째 탭(Home)을 제외한 나머지 탭들의 왼쪽에 회색 선 추가 */
        nav a:not(:first-child) {
            border-left: 2px solid #d0ccc6; /* 회색 선 두께와 색상 */
            border-radius: 0; /* 선이 들어가므로 모서리 둥글기 초기화 (원하시면 유지해도 됩니다) */
            padding-left: 20px;
            margin-left: 10px;
        }

        /* 마우스를 올렸을 때 색상 변화 */
        nav a:hover {
            background-color: #e8833a;
            color: white;
            border-radius: 12px; /* 호버 시 다시 둥글게 */
        }

        /* h1, p 요소를 가운데 정렬 */
        h1, p {
            text-align: center;
        }
        
        h1 {
            color: #82bab3;
            margin-top: 20px;
        }
    </style>
</head>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="tab1.html">Tab 1</a>
        <a href="tab2.html">Tab 2</a>
        <a href="tab3.html">Tab 3</a>
    </nav>
    
    <h1>≡のガレージにようこそ！</h1>
    <p>授業とか自習とかのノートの保管所としてとか、色々使ってます。</p>
</body>
</html>
