<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Class Notes | Equiv's Garage</title>
  
    <!-- Importing Fonts: Zen Maru Gothic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: #fcfbf9;
            color: #333333;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

       /* Navigation (1): Table */
        nav {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid #e0deda;
            padding-bottom: 15px;
        }

        /* Navgation (2): Buttons */
        nav a {
            text-decoration: none;
            color: #555555;
            font-weight: 700;
            margin: 0 10px;
            padding: 8px 16px;
            border-radius: 20px;
            transition: background-color 0.3s, color 0.3s;
            display: inline-block;
        }

        /* Navigation (3): Hovering */
        nav a:hover {
            background-color: #82bab3;
            color: white;
        }

        /* Navigation (4): Divisor */
        .divider {
            color: #d0ccc6;
            font-weight: 400;
            margin: 0 15px;
            user-select: none;
        }

        /* Navigation (5): SNS Favicons */
        .sns-link {
            padding: 0 !important;
            background: none !important;
        }

        .sns-icon {
            height: 20px;
            vertical-align: middle;
            margin-left: 10px;
            transition: opacity 0.3s;
        }

        .sns-icon:hover {
            opacity: 0.6;
            background: none;
        }

        /* 비밀번호 입력 화면 박스 스타일 */
        .auth-container {
            text-align: center;
        }

        .auth-box {
            margin-top: 30px;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: inline-block;
        }

        input[type="password"] {
            padding: 8px 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-right: 5px;
        }

        button {
            padding: 8px 16px;
            font-size: 16px;
            background-color: #82bab3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #52827c;
        }

        #error-msg {
            color: red;
            font-size: 14px;
            margin-top: 10px;
        }

        /* Secured Contents */
        #protected-content {
            display: none;
            text-align: center;
            margin-top: 30px;
        }

        h1 {
            color: #82bab3;
            text-align: center;
        }

        p {
            text-align: left; /* 기본은 좌측 정렬 */
        }

        .text-center {
            text-align: center; /* 필요시 가운데 정렬 */
        }
    </style>
</head>
<body>
  
    <nav>
        <a href="index.html">Home</a>
        <span class="divider"> | </span>
        <a href="sub1.html">Studies</a>
        <span class="divider"> | </span>
        <a href="sub2.html">Sakumon</a>
        <span class="divider"> | </span>
        <a href="sub3.html">Class Notes</a>
        <span class="divider"> | </span>
        <a href="https://x.com/Equiv__" target="_blank" class="sns-link">
            <img src="Files/Images/Favicons/favicon_x.png" alt="X (旧 Twitter)" class="sns-icon">
        </a>
        <a href="https://mathlog.info/users/Irpyu20e3hMAgrXR8FOOajbKAvu1" target="_blank" class="sns-link">
            <img src="Files/Images/Favicons/favicon_mathlog.png" alt="Mathlog" class="sns-icon">
        </a>
    </nav>

    <!-- 1. 비밀번호 입력 화면 -->
    <div class="auth-container">
        <div id="auth-screen" class="auth-box">
            <h2>関係者以外立ち入り禁止</h2>
            <p class="text-center">≡の実際の大学の授業ノートのアーカイブですので、著作権とか色々考慮してパスワードかけてます。</p>
            <input type="password" id="password-input" placeholder="Input Password">
            <button onclick="checkPassword()">Enter</button>
            <div id="error-msg"></div>
        </div>
    </div>

    <!-- 2. 비밀번호가 맞을 때만 보여질 실제 콘텐츠 -->
    <div id="protected-content">
        <h1>≡の大学授業ノートアーカイブ</h1>
        <p>パスワードつきページの作動をとりあえず試したかっただけなので、まだ中身は何もないですよ。</p>
    </div>

    <!-- 비밀번호 확인 스크립트 -->
    <script>
        function checkPassword() {
            const correctPassword = "0911"; // 설정할 비밀번호
            
            const userInput = document.getElementById("password-input").value;
            const authScreen = document.getElementById("auth-screen");
            const protectedContent = document.getElementById("protected-content");
            const errorMsg = document.getElementById("error-msg");

            if (userInput === correctPassword) {
                authScreen.style.display = "none";
                protectedContent.style.display = "block";
            } else {
                errorMsg.textContent = "Invalid Password. Try again.";
            }
        }
    </script>

</body>
</html>
